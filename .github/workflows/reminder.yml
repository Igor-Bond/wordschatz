# Ежедневное напоминание о занятии.
#
# Разбудить закрытое приложение веб не умеет: нужен кто-то снаружи, кто
# пошлёт сообщение. Здесь этим занимается расписание GitHub Actions —
# для публичного репозитория оно бесплатно, и своего сервера не
# появляется.
#
# Честно про точность: cron идёт по UTC и в часы нагрузки опаздывает на
# пять–двадцать минут, а иногда пропускает запуск. Для напоминания
# «пора позаниматься» этого достаточно; будильником оно не станет.
#
# Ещё особенность GitHub: расписание в публичном репозитории отключается
# после шестидесяти дней без коммитов. Если напоминания вдруг пропали —
# смотреть сюда.

name: Напоминание о занятии

on:
  schedule:
    # 17:00 UTC — 19:00 по Киеву летом, 18:00 зимой.
    # Перевод часов cron не знает, сдвиг придётся править руками
    - cron: '0 17 * * *'

  # Кнопка «Run workflow» — чтобы проверить настройку, не дожидаясь вечера
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установить зависимости отправителя
        run: npm install web-push firebase-admin --no-save

      - name: Отправить
        env:
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUSH_URL: https://igor-bond.github.io/wordschatz/
        run: node tools/send-push.mjs
