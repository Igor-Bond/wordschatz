<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="ИИ-репетитор и тренажер немецких слов" data-i18n-content="app.description">
    <title>WortSchatz Pro</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WortSchatz">

    <!-- Локальные зависимости: без них приложение не работало бы офлайн -->
    <script src="vendor/tailwind.min.js"></script>
    <link rel="stylesheet" href="vendor/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/solid.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-300 font-sans antialiased selection:bg-amber-500 selection:text-slate-900 h-[100dvh] overflow-hidden flex flex-col">

    <div id="onboarding-view" class="hidden absolute inset-0 z-50 bg-slate-900 overflow-y-auto"></div>

    <div id="app-view" class="hidden flex-1 flex-col h-full relative">
        <header class="p-4 flex justify-between items-center bg-slate-900/90 backdrop-blur-md sticky top-0 z-10 border-b border-slate-800 pt-[max(env(safe-area-inset-top),16px)]">
            <h1 class="text-2xl font-bold text-slate-100 tracking-wide">🇩🇪 <span class="text-amber-500">Wort</span>Schatz</h1>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5 bg-slate-800 px-3 py-1 rounded-full border border-slate-700 shadow-sm cursor-pointer hover:bg-slate-700 transition">
                    <i class="fa-solid fa-fire text-orange-500"></i>
                    <span id="header-streak" class="font-bold text-slate-200">0</span>
                </div>
            </div>
        </header>

        <main id="main-content" class="flex-1 overflow-y-auto p-4 pb-28 hide-scrollbar"></main>

        <nav class="bg-slate-800 border-t border-slate-700 absolute bottom-0 w-full px-2 pt-2 pb-[max(env(safe-area-inset-bottom),8px)] flex justify-between items-center z-20 shadow-[0_-4px_20px_rgba(0,0,0,0.3)]">
            <button onclick="app.navigate('plan')" class="nav-btn flex-1 flex flex-col items-center gap-1 text-amber-500 transition-colors" data-target="plan">
                <i class="fa-solid fa-list-check text-xl mb-0.5"></i>
                <span class="text-[10px] font-bold tracking-wider" data-i18n="nav.plan">ПЛАН</span>
            </button>
            <button onclick="app.navigate('room')" class="nav-btn flex-1 flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition-colors" data-target="room">
                <i class="fa-solid fa-dumbbell text-xl mb-0.5"></i>
                <span class="text-[10px] font-bold tracking-wider" data-i18n="nav.room">КОМНАТА</span>
            </button>
            
            <div class="flex-none flex justify-center items-center relative -top-6 mx-1">
                <button onclick="app.navigate('scanner')" class="w-14 h-14 bg-amber-500 hover:bg-amber-400 text-slate-900 rounded-full shadow-[0_0_20px_rgba(245,158,11,0.5)] border-[5px] border-slate-900 flex justify-center items-center transition-transform active:scale-95">
                    <i class="fa-solid fa-plus text-2xl font-black"></i>
                </button>
            </div>
            
            <button onclick="app.navigate('chat')" class="nav-btn flex-1 flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition-colors" data-target="chat">
                <i class="fa-solid fa-comment-dots text-xl mb-0.5"></i>
                <span class="text-[10px] font-bold tracking-wider" data-i18n="nav.chat">ИИ-ЧАТ</span>
            </button>
            <button onclick="app.navigate('profile')" class="nav-btn flex-1 flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition-colors" data-target="profile">
                <i class="fa-solid fa-shield-halved text-xl mb-0.5"></i>
                <span class="text-[10px] font-bold tracking-wider" data-i18n="nav.profile">ПРОФИЛЬ</span>
            </button>
        </nav>
    </div>

    <!-- Модальное окно Настроек -->
    <div id="settings-modal" class="hidden fixed inset-0 z-[100] bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 transition-opacity duration-200">
        <div class="bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl w-full max-w-sm overflow-hidden flex flex-col scale-95 transition-transform duration-200" id="settings-modal-content">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
                <h3 class="text-lg font-bold text-slate-100" data-i18n="settings.title">Настройки</h3>
                <button onclick="app.closeSettings()" class="text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1.5"  data-i18n="settings.language">Язык интерфейса</label>
                    <select id="settings-lang" class="w-full bg-slate-900 border border-slate-600 text-slate-100 rounded-lg px-3 py-2 outline-none focus:border-amber-500 text-sm">
                        <option value="ru" selected>Русский (По умолчанию)</option>
                        <option value="uk">Українська</option>
                        <option value="en">English</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5"  data-i18n="settings.level">Уровень</label>
                        <select id="settings-level" class="w-full bg-slate-900 border border-slate-600 text-slate-100 rounded-lg px-3 py-2 outline-none focus:border-amber-500 text-sm">
                            <option value="A1">A1</option>
                            <option value="A2">A2</option>
                            <option value="B1">B1</option>
                            <option value="B2">B2</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5"  data-i18n="settings.dailyGoal">Норма / день</label>
                        <select id="settings-goal" class="w-full bg-slate-900 border border-slate-600 text-slate-100 rounded-lg px-3 py-2 outline-none focus:border-amber-500 text-sm">
                            <option value="5">5 слов</option>
                            <option value="10">10 слов</option>
                            <option value="15">15 слов</option>
                            <option value="20">20 слов</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1.5"  data-i18n="settings.apiKey">API Ключ (Gemini)</label>
                    <input type="text" id="settings-api-key" class="w-full bg-slate-900 border border-slate-600 text-slate-100 rounded-lg px-3 py-2 outline-none focus:border-amber-500 text-sm">
                    <button onclick="app.runDiagnostics()" id="diagnose-btn" class="w-full mt-2 py-2 bg-slate-900 border border-slate-600 text-slate-300 text-xs font-bold rounded-lg hover:border-amber-500 hover:text-amber-500 active:scale-95 transition-all" data-i18n="settings.checkConnection">ПРОВЕРИТЬ ПОДКЛЮЧЕНИЕ</button>
                    <pre id="diagnose-result" class="hidden mt-2 p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-[10px] text-slate-400 whitespace-pre-wrap break-all max-h-40 overflow-y-auto"></pre>
                </div>

                <div class="pt-1">
                    <div class="bg-slate-900/50 rounded-lg p-3 border border-slate-700 text-center shadow-inner">
                        <p class="text-xs font-bold text-slate-300">WortSchatz Pro <span class="text-amber-500">v1.0</span></p>
                        <p class="text-[9px] text-slate-500 mt-0.5 uppercase tracking-wider" data-i18n="settings.createdBy">Created by Igor Bondarenko</p>
                    </div>
                </div>
            </div>
            
            <div class="p-4 border-t border-slate-700 bg-slate-900/50 flex gap-2">
                <button onclick="app.resetAll()" class="flex-1 py-2.5 bg-red-900/30 text-red-500 font-bold rounded-xl border border-red-900 hover:bg-red-900/50 active:scale-95 transition-all text-xs"><span data-i18n="settings.reset">СБРОСИТЬ ВСЁ</span></button>
                <button onclick="app.saveSettings()" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold rounded-xl shadow active:scale-95 transition-all text-xs"><span data-i18n="common.save">СОХРАНИТЬ</span></button>
            </div>
        </div>
    </div>

    <!-- Единственная точка входа: зависимости объявлены через import -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
