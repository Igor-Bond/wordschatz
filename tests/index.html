<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверки WortSchatz</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0; padding: 24px 16px 60px;
            background: #0f172a; color: #cbd5e1;
            font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
        }
        main { max-width: 760px; margin: 0 auto; }
        h1 { font-size: 22px; color: #f1f5f9; margin: 0 0 4px; }
        .подзаголовок { color: #64748b; font-size: 13px; margin-bottom: 20px; }

        .сводка {
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
            padding: 14px 16px; border-radius: 12px; margin-bottom: 20px;
            border: 1px solid #334155; background: #1e293b;
        }
        .сводка.успех { border-color: rgba(34,197,94,.45); background: rgba(34,197,94,.08); }
        .сводка.провал { border-color: rgba(239,68,68,.45); background: rgba(239,68,68,.08); }
        .число { font-size: 26px; font-weight: 800; }
        .зелёный { color: #4ade80; } .красный { color: #f87171; } .серый { color: #64748b; }

        .группа { margin-bottom: 18px; border: 1px solid #334155; border-radius: 12px; overflow: hidden; }
        .группа > h2 {
            margin: 0; padding: 10px 14px; font-size: 13px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .04em;
            background: #1e293b; color: #94a3b8; border-bottom: 1px solid #334155;
        }
        .тест { display: flex; gap: 10px; padding: 8px 14px; border-bottom: 1px solid #1e293b; align-items: baseline; }
        .тест:last-child { border-bottom: none; }
        .тест .знак { width: 16px; flex: none; }
        .тест .имя { flex: 1; }
        .тест .мс { color: #475569; font-size: 12px; }
        .тест.плохо { background: rgba(239,68,68,.07); }
        .ошибка { color: #fca5a5; font-size: 13px; padding: 0 14px 10px 40px; white-space: pre-wrap; }

        button {
            padding: 9px 16px; border-radius: 10px; border: 1px solid #475569;
            background: #0f172a; color: #e2e8f0; font-weight: 700; cursor: pointer;
        }
        button:hover { border-color: #f59e0b; color: #f59e0b; }
    </style>
</head>
<body>
<main>
    <h1>Проверки WortSchatz</h1>
    <p class="подзаголовок">
        Чистая логика: разбор форм, интервалы, освоенность, варианты ответа,
        статьи Wiktionary и словари перевода. База пользователя не затрагивается.
    </p>

    <div class="сводка" id="сводка">
        <span class="число серый" id="счёт">…</span>
        <span id="подпись">Идут проверки</span>
        <span style="flex:1"></span>
        <button onclick="location.reload()">Прогнать заново</button>
    </div>

    <div id="результаты"></div>
</main>

<script type="module">
    import { запустить } from './runner.js';

    // Порядок важен только для читаемости отчёта
    await import('./suites/german.test.js');
    await import('./suites/srs.test.js');
    await import('./suites/mastery.test.js');
    await import('./suites/quiz.test.js');
    await import('./suites/wiktionary.test.js');
    await import('./suites/declension.test.js');
    await import('./suites/actions.test.js');
    await import('./suites/image.test.js');
    await import('./suites/i18n.test.js');

    const экран = (текст) => document.getElementById('подпись').textContent = текст;
    const { results, passed, failed, total } = await запустить(n => экран(`Проверено ${n}`));

    const свод = document.getElementById('сводка');
    свод.className = 'сводка ' + (failed ? 'провал' : 'успех');
    document.getElementById('счёт').className = 'число ' + (failed ? 'красный' : 'зелёный');
    document.getElementById('счёт').textContent = failed ? `${failed}` : `${passed}`;
    экран(failed
        ? `не прошло из ${total}`
        : `проверок пройдено, всё в порядке`);

    document.getElementById('результаты').innerHTML = results.map(g => `
        <section class="группа">
            <h2>${g.name} — ${g.tests.filter(t => t.ok).length}/${g.tests.length}</h2>
            ${g.tests.map(t => `
                <div class="тест ${t.ok ? '' : 'плохо'}">
                    <span class="знак">${t.ok ? '<span class="зелёный">✓</span>' : '<span class="красный">✕</span>'}</span>
                    <span class="имя">${t.name}</span>
                    <span class="мс">${t.ms.toFixed(0)} мс</span>
                </div>
                ${t.ok ? '' : `<div class="ошибка">${t.error}</div>`}
            `).join('')}
        </section>
    `).join('');

    // Итог в консоль: удобно, когда страницу открывают из инструмента
    console.log(`[Проверки] пройдено ${passed} из ${total}` + (failed ? `, провалено ${failed}` : ''));
    window.__testSummary = { passed, failed, total, results };
</script>
</body>
</html>
